# 客情健康度评分配置 V3.0
# 来源：《客情健康度评估_因子精简版V3.0.docx》
# 计算口径：因子原始值 -> 0-10 分；维度内算术平均；7 个维度加权汇总为 0-100 分。

version: "2026.08.24-v3"
updated_at: "2026-08-24"
description: "客情健康度评分配置 V3.0（7 维度、28 因子、维度内等权）"

levels:
  - {name: 健康, min_score: 80, color: "#22c55e"}
  - {name: 亚健康, min_score: 60, color: "#eab308"}
  - {name: 风险, min_score: 40, color: "#f97316"}
  - {name: 高危, min_score: 0, color: "#ef4444"}

dimensions:
  - key: kcr
    name: KCR 关键客户关系
    max_score: 30
    aggregation: average
    description: 销售（AR）与客户决策链关键岗位人员的关系深度
    factors:
      - field: kcr_01
        label: KCR-01 决策链识别完整度
        weight: 1
        source: custom_fields
        source_role: AR
        frequency: 月度
        description: 已识别决策链人数 / 应识别决策链人数（%）
        example: "87.5%"
        input:
          type: select
          unit: "%"
          options: ["100%", "80-99%", "60-79%", "40-59%", "0-39%"]
        rule:
          type: threshold
          parser: percent
          brackets:
            - {eq: 100, score: 10, detail: "决策链识别 {value}：{score}分"}
            - {gte: 80, score: 8, detail: "决策链识别 {value}：{score}分"}
            - {gte: 60, score: 6, detail: "决策链识别 {value}：{score}分"}
            - {gte: 40, score: 4, detail: "决策链识别 {value}：{score}分"}
          default: {score: 1, detail: "决策链识别 {value}：{score}分"}

      - field: kcr_02
        label: KCR-02 关键人客情等级分布
        weight: 1
        source: custom_fields
        source_role: AR
        frequency: 月度
        description: 各关键人客情等级平均（-1反对/0中立/1支持/2强支持/3教练级）
        example: "[3,2,2,1,1]"
        input:
          type: key_person_levels
          options: ["3", "2", "1", "0", "-1"]
        rule:
          type: threshold
          parser: average_list
          brackets:
            - {gte: 2, score: 10, detail: "关键人客情等级 {value}：{score}分"}
            - {gte: 1.5, score: 8, detail: "关键人客情等级 {value}：{score}分"}
            - {gte: 1, score: 6, detail: "关键人客情等级 {value}：{score}分"}
            - {gte: 0.5, score: 4, detail: "关键人客情等级 {value}：{score}分"}
          default: {score: 1, detail: "关键人客情等级 {value}：{score}分"}

      - field: kcr_04
        label: KCR-04 信息共享度
        weight: 1
        source: custom_fields
        source_role: AR
        frequency: 月度
        description: 90天内客户主动分享非公开信息次数
        example: "2次"
        input: {type: select, options: ["≥3次", "2次", "1次", "0次"]}
        rule:
          type: threshold
          parser: number
          brackets:
            - {gte: 3, score: 10, detail: "90天内信息共享 {value}：{score}分"}
            - {gte: 2, score: 7, detail: "90天内信息共享 {value}：{score}分"}
            - {gte: 1, score: 4, detail: "90天内信息共享 {value}：{score}分"}
            - {gte: 0, score: 1, detail: "90天内信息共享 {value}：{score}分"}
          default: {score: 1, detail: "90天内信息共享 {value}：{score}分"}

      - field: kcr_07
        label: KCR-07 关键人支持度分布
        weight: 1
        source: custom_fields
        source_role: AR
        frequency: 月度
        description: 支持者人数占比及反对者人数占比
        example: "支持62.5%且反对12.5%"
        input:
          type: select
          options: ["支持≥60%且无反对", "支持≥60%但有反对", "40-59%支持", "20-39%支持", "<20%支持"]
        rule:
          type: support_distribution
          top_score: 10
          opposition_downgrade_score: 8
          score_40: 8
          score_20: 6
          score_low: 3
          default_score: 3
          map:
            "支持≥60%且无反对": 10
            "支持≥60%但有反对": 8
            "40-59%支持": 8
            "20-39%支持": 6
            "<20%支持": 3
          detail: "关键人支持度 {value}：{score}分"

      - field: kcr_08
        label: KCR-08 内部Champion存在度
        weight: 1
        source: custom_fields
        source_role: AR
        frequency: 月度
        description: 是否有决策层人员主动推动我方方案（取最高级别）
        example: CXO级且能影响EB
        input:
          type: select
          options: [CXO级且能影响EB, VP级, 总监级, 无]
        rule:
          type: mapping
          map: {CXO级且能影响EB: 10, VP级: 8, 总监级: 6, 无: 1}
          default_score: 1
          detail: "内部Champion「{value}」：{score}分"

      - field: kcr_10b
        label: KCR-10B 决策流程影响力
        weight: 1
        source: custom_fields
        source_role: AR
        frequency: 月度
        description: 是否掌握决策流程 + 可控关键节点数
        example: 全流程且2节点可控
        input:
          type: select
          options: [全流程且≥3节点可控, 全流程且2节点可控, 1-2节点可控, 部分掌握, 不了解]
        rule:
          type: mapping
          map:
            全流程且≥3节点可控: 10
            全流程且2节点可控: 7
            1-2节点可控: 7
            部分掌握: 4
            不了解: 1
          default_score: 1
          detail: "决策流程影响力「{value}」：{score}分"

  - key: er
    name: ER 普遍客户关系
    max_score: 18
    aggregation: average
    description: 与客户基层执行层的关系质量
    factors:
      - field: er_01
        label: ER-01 基层触点覆盖度
        weight: 1
        source: custom_fields
        source_role: AR+FR
        frequency: 月度
        description: 有稳定对接的基层岗位数 / 应覆盖基层岗位数（%）
        example: "80%"
        input: {type: select, unit: "%", options: ["100%", "80-99%", "60-79%", "40-59%", "0-39%"]}
        rule:
          type: threshold
          parser: percent
          brackets:
            - {eq: 100, score: 10, detail: "基层触点覆盖 {value}：{score}分"}
            - {gte: 80, score: 8, detail: "基层触点覆盖 {value}：{score}分"}
            - {gte: 60, score: 6, detail: "基层触点覆盖 {value}：{score}分"}
            - {gte: 40, score: 4, detail: "基层触点覆盖 {value}：{score}分"}
          default: {score: 1, detail: "基层触点覆盖 {value}：{score}分"}

      - field: er_05
        label: ER-05 技术认可度
        weight: 1
        source: custom_fields
        source_role: SR
        frequency: 月度
        description: 我方方案在客户内部评价等级 + 是否参与标书参数制定
        example: 标杆且参与定标
        input: {type: select, options: [标杆且参与定标, 标杆, 相当, 落后]}
        rule:
          type: mapping
          map: {标杆且参与定标: 10, 标杆: 8, 相当: 5, 落后: 2}
          default_score: 2
          detail: "技术认可度「{value}」：{score}分"

      - field: er_07
        label: ER-07 培训赋能频次
        weight: 1
        source: custom_fields
        source_role: AR+FR
        frequency: 月度
        description: 半年内对客户基层团队培训/赋能次数
        example: "3次"
        input: {type: select, options: ["≥4次", "2-3次", "1次", "0次"]}
        rule:
          type: threshold
          parser: number
          brackets:
            - {gte: 4, score: 10, detail: "半年培训赋能 {value}：{score}分"}
            - {gte: 2, score: 7, detail: "半年培训赋能 {value}：{score}分"}
            - {gte: 1, score: 4, detail: "半年培训赋能 {value}：{score}分"}
            - {gte: 0, score: 1, detail: "半年培训赋能 {value}：{score}分"}
          default: {score: 1, detail: "半年培训赋能 {value}：{score}分"}

      - field: er_08
        label: ER-08 问题响应满意度
        weight: 1
        source: custom_fields
        source_role: FR+AR
        frequency: 月度
        description: 基层问题/需求响应及时率（%）
        example: "83%"
        input: {type: select, unit: "%", options: ["100%", "80-99%", "60-79%", "0-59%"]}
        rule:
          type: threshold
          parser: percent
          brackets:
            - {eq: 100, score: 10, detail: "问题响应及时率 {value}：{score}分"}
            - {gte: 80, score: 7, detail: "问题响应及时率 {value}：{score}分"}
            - {gte: 60, score: 4, detail: "问题响应及时率 {value}：{score}分"}
          default: {score: 1, detail: "问题响应及时率 {value}：{score}分"}

  - key: or
    name: OR 组织客户关系
    max_score: 14
    aggregation: average
    description: 甲乙双方公司级、部门级战略合作关系
    factors:
      - field: or_01
        label: OR-01 战略协议层级
        weight: 1
        source: custom_fields
        source_role: AR+管理层
        frequency: 季度
        description: 是否签署战略协议 + 协议层级
        example: 区域级
        input: {type: select, options: [集团级, 区域级, 项目级框架, 无]}
        rule:
          type: mapping
          map: {集团级: 10, 区域级: 7, 项目级框架: 4, 无: 0}
          default_score: 0
          detail: "战略协议层级「{value}」：{score}分"

      - field: or_02
        label: OR-02 高层互访频次
        weight: 1
        source: custom_fields
        source_role: AR
        frequency: 季度
        description: 12个月内VP及以上正式互访/会晤次数
        example: "3次"
        input: {type: select, options: ["≥4次", "2-3次", "1次", "0次"]}
        rule:
          type: threshold
          parser: number
          brackets:
            - {gte: 4, score: 10, detail: "高层互访 {value}：{score}分"}
            - {gte: 2, score: 7, detail: "高层互访 {value}：{score}分"}
            - {gte: 1, score: 4, detail: "高层互访 {value}：{score}分"}
            - {gte: 0, score: 1, detail: "高层互访 {value}：{score}分"}
          default: {score: 1, detail: "高层互访 {value}：{score}分"}

      - field: or_06
        label: OR-06 生态合作嵌入度
        weight: 1
        source: custom_fields
        source_role: 生态/行业
        frequency: 季度
        description: 生态伙伴计划 + 人才交流 + 联合营销开展项数
        example: "2项"
        input: {type: select, options: ["≥3项", "2项", "1项", "0项"]}
        rule:
          type: threshold
          parser: number
          brackets:
            - {gte: 3, score: 10, detail: "生态合作开展 {value}：{score}分"}
            - {gte: 2, score: 8, detail: "生态合作开展 {value}：{score}分"}
            - {gte: 1, score: 5, detail: "生态合作开展 {value}：{score}分"}
            - {gte: 0, score: 0, detail: "生态合作开展 {value}：{score}分"}
          default: {score: 0, detail: "生态合作开展 {value}：{score}分"}

  - key: ci
    name: CI 客户洞察与业务理解
    max_score: 9
    aggregation: average
    description: 先理解客户业务，再建立关系
    factors:
      - field: ci_01
        label: CI-01 客户业务战略理解度（含痛点映射）
        weight: 1
        source: custom_fields
        source_role: AR+SR
        frequency: 月度
        description: 业务战略与IT规划、行业挑战、痛点地图及方案映射三项完成数
        example: 3项全部完成
        input: {type: select, options: ["3项全部完成", "2项完成", "1项完成", "0项完成"]}
        rule:
          type: threshold
          parser: number
          brackets:
            - {gte: 3, score: 10, detail: "业务战略理解 {value}：{score}分"}
            - {gte: 2, score: 6, detail: "业务战略理解 {value}：{score}分"}
            - {gte: 1, score: 3, detail: "业务战略理解 {value}：{score}分"}
            - {gte: 0, score: 0, detail: "业务战略理解 {value}：{score}分"}
          default: {score: 0, detail: "业务战略理解 {value}：{score}分"}

      - field: ci_03
        label: CI-03 决策标准掌握度（含预算与周期）
        weight: 1
        source: custom_fields
        source_role: AR+SR
        frequency: 月度
        description: 核心评估标准、方案对齐、预算与决策周期三项掌握数
        example: 3项全部掌握
        input: {type: select, options: ["3项全部掌握", "2项掌握", "1项掌握", "0项掌握"]}
        rule:
          type: threshold
          parser: number
          brackets:
            - {gte: 3, score: 10, detail: "决策标准掌握 {value}：{score}分"}
            - {gte: 2, score: 7, detail: "决策标准掌握 {value}：{score}分"}
            - {gte: 1, score: 4, detail: "决策标准掌握 {value}：{score}分"}
            - {gte: 0, score: 0, detail: "决策标准掌握 {value}：{score}分"}
          default: {score: 0, detail: "决策标准掌握 {value}：{score}分"}

      - field: ci_05
        label: CI-05 价值量化与ROI呈现
        weight: 1
        source: custom_fields
        source_role: SR
        frequency: 月度
        description: 是否提供量化价值主张/ROI测算及客户是否认可
        example: 量化且客户认可
        input: {type: select, options: [量化且客户认可, 量化未认可, 仅定性, 无]}
        rule:
          type: mapping
          map: {量化且客户认可: 10, 量化未认可: 6, 仅定性: 3, 无: 0}
          default_score: 0
          detail: "价值量化与ROI「{value}」：{score}分"

  - key: his
    name: HIS 历史合作与经营结果
    max_score: 12
    aggregation: average
    description: 用已发生的商业结果校验客情质量
    factors:
      - field: his_02
        label: HIS-02 年均合作金额趋势
        weight: 1
        source: custom_fields
        source_role: 系统
        frequency: 实时
        description: 近3年合同额趋势
        example: 上升后持平
        input: {type: select, options: [连续上升, 上升后持平, 持平, 下降, 连续下降]}
        rule:
          type: mapping
          map: {连续上升: 10, 上升后持平: 7, 持平: 5, 下降: 3, 连续下降: 1}
          default_score: 1
          detail: "合作金额趋势「{value}」：{score}分"

      - field: his_04
        label: HIS-04 钱包份额(Wallet Share)
        weight: 1
        source: custom_fields
        source_role: 系统
        frequency: 实时
        description: 我司订单 / 客户年度IT总采购额（%）
        example: "33%"
        input: {type: select, unit: "%", options: ["≥50%", "30-49%", "15-29%", "5-14%", "0-4%"]}
        rule:
          type: threshold
          parser: percent
          brackets:
            - {gte: 50, score: 10, detail: "钱包份额 {value}：{score}分"}
            - {gte: 30, score: 8, detail: "钱包份额 {value}：{score}分"}
            - {gte: 15, score: 6, detail: "钱包份额 {value}：{score}分"}
            - {gte: 5, score: 4, detail: "钱包份额 {value}：{score}分"}
          default: {score: 1, detail: "钱包份额 {value}：{score}分"}

      - field: his_06
        label: HIS-06 续约与增购
        weight: 1
        source: custom_fields
        source_role: 系统
        frequency: 实时
        description: 到期项目续约率 + 是否有增购/扩容
        example: 续约≥80%且增购
        input: {type: select, options: [续约≥80%且增购, 续约≥80%, 续约50-79%, 续约<50%]}
        rule:
          type: mapping
          map: {续约≥80%且增购: 10, 续约≥80%: 7, 续约50-79%: 4, 续约<50%: 1}
          default_score: 1
          detail: "续约与增购「{value}」：{score}分"

      - field: his_09
        label: HIS-09 NPS/客户满意度
        weight: 1
        source: custom_fields
        source_role: 系统
        frequency: 实时
        description: 三方NPS或满意度调研得分
        example: "75"
        input: {type: select, options: ["≥80", "70-79", "60-69", "0-59"]}
        rule:
          type: threshold
          parser: number
          brackets:
            - {gte: 80, score: 10, detail: "NPS/满意度 {value}：{score}分"}
            - {gte: 70, score: 7, detail: "NPS/满意度 {value}：{score}分"}
            - {gte: 60, score: 4, detail: "NPS/满意度 {value}：{score}分"}
          default: {score: 1, detail: "NPS/满意度 {value}：{score}分"}

  - key: risk
    name: RISK 竞争态势与风险信号
    max_score: 12
    aggregation: average
    description: 前瞻性竞争与风险信号
    factors:
      - field: risk_05
        label: RISK-05 关键人变动预警
        weight: 1
        source: custom_fields
        source_role: AR
        frequency: 月度
        description: 3个月内客户方关键岗位离职/调岗人数
        example: 1人变动
        input: {type: select, options: [无变动, 1人变动, "≥2人变动"]}
        rule:
          type: mapping
          map: {无变动: 10, 1人变动: 5, "≥2人变动": 0}
          default_score: 0
          detail: "关键人变动「{value}」：{score}分"

      - field: risk_06
        label: RISK-06 互动频次下降
        weight: 1
        source: custom_fields
        source_role: AR
        frequency: 月度
        description: 近3月各层级互动频次环比变化
        example: 下降<20%
        input: {type: select, options: [上升, 持平, "下降<20%", "下降≥20%"]}
        rule:
          type: mapping
          map: {上升: 10, 持平: 7, "下降<20%": 4, "下降≥20%": 1}
          default_score: 1
          detail: "互动频次变化「{value}」：{score}分"

      - field: risk_07
        label: RISK-07 竞品POC/试点
        weight: 1
        source: custom_fields
        source_role: AR
        frequency: 月度
        description: 客户是否已启动竞品POC或试点
        example: 是但可控
        input: {type: select, options: [否, 是但可控, 是且进展顺利]}
        rule:
          type: mapping
          map: {否: 10, 是但可控: 5, 是且进展顺利: 0}
          default_score: 0
          detail: "竞品POC/试点「{value}」：{score}分"

      - field: risk_08b
        label: RISK-08B 客户费力度CES
        weight: 1
        source: custom_fields
        source_role: FR+系统
        frequency: 月度
        description: 问题一次解决率 / 平均交互次数 / 信息重复提供情况
        example: 中(80-90%)
        input: {type: select, options: ["低费力(一次解决率>90%)", "中(80-90%)", "较高(60-79%)", "高(<60%)"]}
        rule:
          type: mapping
          map: {"低费力(一次解决率>90%)": 10, "中(80-90%)": 7, "较高(60-79%)": 4, "高(<60%)": 1}
          default_score: 1
          detail: "客户费力度CES「{value}」：{score}分"

      - field: risk_08c
        label: RISK-08C 客户自身经营风险
        weight: 1
        source: custom_fields
        source_role: 行业部门
        frequency: 季度
        description: 行业景气度 + 客户财务健康（财报/信用评级）
        example: 平稳
        input: {type: select, options: [行业上行且财务健康, 平稳, 下行或承压, 危机]}
        rule:
          type: mapping
          map: {行业上行且财务健康: 10, 平稳: 7, 下行或承压: 4, 危机: 1}
          default_score: 1
          detail: "客户自身经营风险「{value}」：{score}分"

  - key: svc
    name: SVC 服务与支持健康度
    max_score: 5
    aggregation: average
    description: 服务与支持是客情的最后一道防线
    factors:
      - field: svc_03
        label: SVC-03 故障响应时效
        weight: 1
        source: custom_fields
        source_role: 系统
        frequency: 月度
        description: 平均首次响应时长 + SLA达标率
        example: "<15min且达标率>95%"
        input:
          type: select
          options: ["<15min且达标率>95%", "<30min且>90%", "<1h且>80%", "≥1h或达标率≤80%"]
        rule:
          type: mapping
          map:
            "<15min且达标率>95%": 10
            "<15分钟且SLA>95%": 10
            "<30min且>90%": 7
            "<30分钟且SLA>90%": 7
            "<1h且>80%": 4
            "<1小时且SLA>80%": 4
          default_score: 0
          detail: "故障响应时效「{value}」：{score}分"

      - field: svc_04
        label: SVC-04 故障解决效率
        weight: 1
        source: custom_fields
        source_role: 系统
        frequency: 月度
        description: 平均解决时长 + 一次性解决率
        example: "<4h且一次解决率>90%"
        input:
          type: select
          options: ["<4h且一次解决率>90%", "<8h且>80%", "<24h且>70%", "≥24h或一次解决率≤70%"]
        rule:
          type: mapping
          map:
            "<4h且一次解决率>90%": 10
            "<4小时且一次解决率>90%": 10
            "<8h且>80%": 7
            "<8小时且一次解决率>80%": 7
            "<24h且>70%": 4
            "<24小时且一次解决率>70%": 4
          default_score: 0
          detail: "故障解决效率「{value}」：{score}分"

      - field: svc_05
        label: SVC-05 主动服务频次
        weight: 1
        source: custom_fields
        source_role: FR
        frequency: 月度
        description: 半年内主动巡检/预警/优化建议次数
        example: 4-5次
        input: {type: select, options: ["≥6次", "4-5次", "2-3次", "0-1次"]}
        rule:
          type: threshold
          parser: number
          brackets:
            - {gte: 6, score: 10, detail: "主动服务频次 {value}：{score}分"}
            - {gte: 4, score: 7, detail: "主动服务频次 {value}：{score}分"}
            - {gte: 2, score: 4, detail: "主动服务频次 {value}：{score}分"}
          default: {score: 1, detail: "主动服务频次 {value}：{score}分"}

