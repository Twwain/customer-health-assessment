          detail: "客户费力度CES「{value}」：+{score}分"

      - field: risk_08c
        label: RISK-08C 客户自身经营风险
        weight: 1.2
        source: custom_fields
        source_role: 市场
        description: 原子指标：行业景气度 + 客户财务健康（财报/信用评级）（二级维度：风险信号）
        input:
          type: select
          options: [行业上行且财务健康, 平稳, 下行或承压, 危机]
        rule:
          type: mapping
          map:
            行业上行且财务健康: 1.2
            平稳: 0.84
            下行或承压: 0.48
            危机: 0.12
          default_score: 0.84
          detail: "客户自身经营风险「{value}」：+{score}分"

  # ⑦ SVC 服务与支持健康度（权重 5%，CSM 客户成功管理）─────────────────────
  - key: svc
    name: SVC 服务与支持健康度
    max_score: 5
    enabled: true
    description: 交付质量 · 运维与故障处理 · 主动服务（FR+系统，月度填报）
    factors:

      # 二级维度：交付质量（35% → 组内 2 因子均权，每个满分 0.875）
      - field: svc_01
        label: SVC-01 项目交付达标率
        weight: 0.875
        source: custom_fields
        source_role: FR
        description: 原子指标：方案匹配度 + 工期偏差率 + 文档完整性（二级维度：交付质量）
        input:
          type: select
          options: [3项达标, 2项达标, 1项达标, 0项达标]
        rule:
          type: mapping
          map:
            3项达标: 0.875
            2项达标: 0.6125
            1项达标: 0.35
            0项达标: 0.0875
          default_score: 0.0875
          detail: "项目交付达标率「{value}」：+{score}分"

      - field: svc_02
        label: SVC-02 验收按时率
        weight: 0.875
        source: custom_fields
        source_role: FR
        description: 原子指标：12 个月内交付项目按时验收比例（二级维度：交付质量）
        input:
          type: select
          options: ["100%", "≥90%", "≥80%", "<80%"]
        rule:
          type: mapping
          map:
            "100%": 0.875
            "≥90%": 0.6125
            "≥80%": 0.35
            "<80%": 0.0875
          detail: "验收按时率 {value}%（100%）：+{score}分"
          default_score: 0.0875

      # 二级维度：运维与故障处理（30% → 组内 2 因子均权，每个满分 0.75）
      - field: svc_03
        label: SVC-03 故障响应时效
        weight: 0.75
        source: custom_fields
        source_role: FR
        description: 原子指标：平均首次响应时长 + SLA 达标率（二级维度：运维与故障处理）
        input:
          type: select
          options: ["<15分钟且SLA>95%", "<30分钟且SLA>90%", "<1小时且SLA>80%", 未达标]
        rule:
          type: mapping
          map:
            "<15分钟且SLA>95%": 0.75
            "<30分钟且SLA>90%": 0.525
            "<1小时且SLA>80%": 0.3
            未达标: 0.075
          default_score: 0.075
          detail: "故障响应时效「{value}」：+{score}分"

      - field: svc_04
        label: SVC-04 故障解决效率
        weight: 0.75
        source: custom_fields
        source_role: FR
        description: 原子指标：平均解决时长 + 一次性解决率（二级维度：运维与故障处理）
        input:
          type: select
          options: ["<4小时且一次解决率>90%", "<8小时且>80%", "<24小时且>70%", 未达标]
        rule:
          type: mapping
          map:
            "<4小时且一次解决率>90%": 0.75
            "<8小时且>80%": 0.525
            "<24小时且>70%": 0.3
            未达标: 0.075
          default_score: 0.075
          detail: "故障解决效率「{value}」：+{score}分"

      # 二级维度：主动服务（35% → 组内 3 因子均权，每个满分 0.583333）
      - field: svc_05
        label: SVC-05 主动服务频次
        weight: 0.583333
        source: custom_fields
        source_role: FR
        description: 原子指标：半年内主动巡检/预警/优化建议次数（二级维度：主动服务）
        input:
          type: select
          options: ["≥6次", "4-5次", "2-3次", "<2次"]
        rule:
          type: mapping
          map:
            "≥6次": 0.583333
            "4-5次": 0.408333
            "2-3次": 0.233333
            "<2次": 0.058333
          detail: "半年主动服务 {value} 次（≥6次）：+{score}分"
          default_score: 0.058333

      - field: svc_06
        label: SVC-06 客户回访与跟进
        weight: 0.583333
        source: custom_fields
        source_role: FR
        description: 原子指标：项目交付后定期回访 + 跟进（二级维度：主动服务）
        input:
          type: select
          options: [标准化且执行, 不定期, 无回访]
        rule:
          type: mapping
          map:
            标准化且执行: 0.583333
            不定期: 0.291667
            无回访: 0.058333
          default_score: 0.058333
          detail: "客户回访与跟进「{value}」：+{score}分"

      - field: svc_06b
        label: SVC-06B 知识转移与赋能效果
        weight: 0.583333
        source: custom_fields
        source_role: FR
        description: 原子指标：知识转移培训 + 客户自主运维提升 + 定期白皮书分享（CSM，二级维度：主动服务）
        input:
          type: select
          options: [3项, 2项, 1项, 0项]
        rule:
          type: mapping
          map:
            3项: 0.583333
            2项: 0.408333
            1项: 0.233333
            0项: 0.058333
          default_score: 0.058333
          detail: "知识转移与赋能「{value}」：+{score}分"

# ── 风险预警规则（顺序即展示顺序）────────────────────────────────────────────
# level：high=红 / medium=黄 / low=蓝（前端 AlertBadge 色彩编码）
# 来源：自动预警条件（字段级可落地部分）+ 保留原有高频预警
# when.op 支持：truthy / falsy / is_true / is_false / empty / eq / ne /
#               lt / lte / gt / gte / in / not_in / contains /
#               days_since_gt / days_since_gt_or_empty
alerts:

  - id: ces_deterioration
    level: high
    when:
      field: risk_08b
      source: custom_fields
      op: in
      value: [较高(60-79%), 高(<60%)]
    message: "客户费力度CES恶化（{value}），客户体验存在严重问题"
    suggestion: "建议启动 CES 专项改进：降低交互成本、提升一次解决率"

  - id: customer_business_crisis
    level: high
    when:
      field: risk_08c
      source: custom_fields
      op: in
      value: [下行或承压, 危机]
    message: "客户自身经营风险上升（{value}），可能影响合作与回款"
    suggestion: "建议评估客户财务健康度，调整合作节奏与风险敞口"

  - id: competitor_poc
    level: high
    when:
      field: risk_07
      source: custom_fields
      op: in
      value: [是但可控, 是且进展顺利]
    message: "客户已启动竞品POC/试点（{value}），存在被替换风险"
    suggestion: "建议立即介入竞品POC环节，突出差异化优势并争取联合测试"

  - id: relationship_deterioration
    level: high
    when:
      field: risk_08
      source: custom_fields
      op: in
      value: [1次正式投诉, ≥2次或重大投诉]
    message: "客情恶化信号：{value}"
    suggestion: "建议深入调查投诉成因，制定关系修复与整改计划"

  - id: key_person_churn
    level: medium
    when:
      field: risk_05
      source: custom_fields
      op: in
      value: [1人变动, ≥2人变动]
    message: "关键人变动预警：{value}"
    suggestion: "建议尽快完成新关键人关系建立与决策链重绘"

  - id: interaction_decline
    level: medium
    when:
      field: risk_06
      source: custom_fields
      op: in
      value: [下降<20%, 下降≥20%]
    message: "各层级互动频次下降：{value}"
    suggestion: "建议增加拜访与沟通频次，防止关系转冷"

  - id: champion_missing
    level: medium
    when:
      field: kcr_08
      source: custom_fields
      op: eq
      value: 无
    message: "客户内部缺少 Champion，方案推进缺乏内部推手"
    suggestion: "建议识别并培养决策层 Champion"

  - id: stale_contact
    level: high
    when:
      field: last_contact_date
      op: days_since_gt_or_empty
      value: 90
    message: "超过90天未联系客户，关系存在疏远风险"
    suggestion: "建议尽快安排客户拜访或沟通"

  - id: competitor_involved
    level: high
    when:
      field: competitor_involvement
      op: is_true
    message: "竞品已介入，客户存在被挖角风险"
    suggestion: "建议加强客情维护，突出自身差异化优势"

  - id: payment_abnormal
    level: medium
    when:
      field: payment_status
      op: in
      value: [部分逾期, 严重逾期]
    message: "回款状态异常：{value}"
    suggestion: "建议跟进回款进度，评估是否需要调整合作模式"

  - id: low_satisfaction
    level: high
    when:
      all:
        - field: customer_satisfaction
          op: gt
          value: 0
        - field: customer_satisfaction
          op: lte
          value: 4
    message: "客户满意度较低({value}/10)，存在流失风险"
    suggestion: "建议深入了解客户不满原因并制定改善计划"

  - id: risk_signal
    level: medium
    when:
      field: risk_signals
      op: truthy
    message: "存在风险信号：{value}"
    suggestion: "建议针对风险信号制定应对方案"

# ── 机会点建议（不产生预警，仅追加建议）──────────────────────────────────────
opportunities:

  - id: high_wallet_and_satisfaction
    when:
      all:
        - field: his_04
          source: custom_fields
          op: eq
          value: "≥50%"
        - field: customer_satisfaction
          op: gte
          value: 7
    suggestion: "该客户钱包份额高且满意度良好，建议加大资源投入推动战略升级"

  - id: growth_stage_with_champion
    when:
      all:
        - field: his_09b
          source: custom_fields
          op: eq
          value: 成长期
        - field: kcr_07
          source: custom_fields
          op: eq
          value: "≥60%支持且无反对"
    suggestion: "客户处于成长期且关键人支持度高，建议深化 Champion 维护与方案绑定"

  - id: ecosystem_deep
    when:
      field: or_06
      source: custom_fields
      op: eq
      value: 3项
    suggestion: "生态合作嵌入度高，建议通过联合营销与战略绑定进一步形成护城河"
