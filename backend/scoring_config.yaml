# ==============================================================================
# 客情评估智能体 — 量化评估引擎评分配置
# ------------------------------------------------------------------------------
# 7 个评估维度 × 60 个因子，
# 融合 MCR 三维体系 + MEDDIC / 决策流程方法论 / Customer Health Score /
# CES / BANT / RFM / CSM / SAM 八大框架。
#
# 维度 / 因子 / 权重 / 打分规则 / 预警 / 等级阈值全部配置化：
# 修改本文件后重启服务即生效，**无需改动任何代码**。
#
# 计分口径（四级计算模型，折算进本引擎的「维度求和」模型）：
#   因子原始得分 0-10 → 按 二级维度权重 × 组内因子均权 × 一级维度权重 折算为本因子分值
#   维度得分 = 组内各因子分值之和（满分 = 一级权重分，7 维合计 100）
#   总分 = 各维度得分之和（满分 100）
#
# 新增一个因子只需三步：
#   ① 若为新字段：在 Customer 模型加列，或直接使用 custom_fields（设 source: custom_fields）
#   ② 在下面对应维度的 factors 中注册字段、权重、input（供前端动态渲染表单）与 rule
#   ③ 重启服务，评分引擎与 GET /api/customers/factor-config 自动读取
#
# ------------------------------------------------------------------------------
# 支持的打分规则类型（rule.type）
# ------------------------------------------------------------------------------
#   threshold  数值分档。brackets 按顺序匹配，命中即止；支持 gte/gt/lte/lt/eq。
#              （加载时自动规范化顺序：纯 gte/gt 按阈值降序、纯 lte/lt 按升序）
#   mapping    枚举映射。map 精确匹配取分，未命中用 default_score。
#   days_since 日期距今天数分档。empty 处理空值，brackets 用 lte/gte 匹配天数。
#   linear     线性换算。score = value * multiplier + offset，可选 clamp。
#   penalty    条件扣分。when: truthy / falsy / is_true / is_false，命中才计分与记明细。
#   constant   固定分（用于占位因子）。
#
# detail 为明细文案模板，可用占位符：{value} 原始值 · {score} 本因子得分 · {days} 距今天数
# ------------------------------------------------------------------------------
# 说明：weight = 该因子在本维度中的满分（已按二级维度权重折算），
#       仅用于展示与校验；实际得分由 rule 计算。
# ==============================================================================

version: "2026.08"
updated_at: "2026-08-06"
description: "客情健康度评分配置 — 7 维度加权模型（满分 100，共 60 因子）"

# ── 等级阈值（按 min_score 从高到低匹配）─────────────────────────────────────
levels:
  - name: 健康
    min_score: 80
    color: "#22c55e"
  - name: 亚健康
    min_score: 60
    color: "#eab308"
  - name: 风险
    min_score: 40
    color: "#f97316"
  - name: 高危
    min_score: 0
    color: "#ef4444"

# ── 评分维度 ────────────────────────────────────────────────────────────────
dimensions:

  # ① KCR 关键客户关系（权重 30%，MCR + MEDDIC + 决策流程方法论）────────────
  - key: kcr
    name: KCR 关键客户关系
    max_score: 30
    enabled: true
    description: 决策链覆盖 · 信息互通与信任深度 · 决策支持与影响力（AR 为主，月度填报）
    factors:

      # 二级维度：决策链覆盖度（28% → 组内 4 因子均权，每个满分 2.1）
      - field: kcr_01
        label: KCR-01 决策链识别完整度
        weight: 2.1
        source: custom_fields
        source_role: AR
        description: 原子指标：已识别决策链人数占比（二级维度：决策链覆盖度）
        input:
          type: select
          options: ["100%", "≥80%", "≥60%", "≥40%", "<40%"]
        rule:
          type: mapping
          map:
            "100%": 2.1
            "≥80%": 1.68
            "≥60%": 1.26
            "≥40%": 0.84
            "<40%": 0.21
          detail: "已识别占比 {value}%（100%）：+{score}分"
          default_score: 0.21

      - field: kcr_02
        label: KCR-02 关键人客情等级分布
        weight: 2.1
        source: custom_fields
        source_role: AR
        description: 原子指标：各关键人客情等级加权平均（-1~3，二级维度：决策链覆盖度）
        input:
          type: select
          options: ["≥2", "1.5-1.9", "1-1.4", "0.5-0.9", "<0.5"]
        rule:
          type: mapping
          map:
            "≥2": 2.1
            "1.5-1.9": 1.68
            "1-1.4": 1.26
            "0.5-0.9": 0.84
            "<0.5": 0.21
          detail: "客情等级均值 {value}（≥2）：+{score}分"
          default_score: 0.21

      - field: kcr_03
        label: KCR-03 高层CXO/VP覆盖率
        weight: 2.1
        source: custom_fields
        source_role: AR
        description: 原子指标：已建立稳定联系的高层占比（二级维度：决策链覆盖度）
        input:
          type: select
          options: ["100%", "≥80%", "≥60%", "≥40%", "<40%"]
        rule:
          type: mapping
          map:
            "100%": 2.1
            "≥80%": 1.68
            "≥60%": 1.26
            "≥40%": 0.84
            "<40%": 0.21
          detail: "高层覆盖率 {value}%（100%）：+{score}分"
          default_score: 0.21

      - field: kcr_03b
        label: KCR-03B 经济决策者识别度
        weight: 2.1
        source: custom_fields
        source_role: AR
        description: 原子指标：是否识别 EB（Economic Buyer）并评估对其影响力（MEDDIC，二级维度：决策链覆盖度）
        input:
          type: select
          options: [已识别且影响力≥2级, 已识别影响力1级, 不确定, 未识别]
        rule:
          type: mapping
          map:
            已识别且影响力≥2级: 2.1
            已识别影响力1级: 1.47
            不确定: 0.63
            未识别: 0
          default_score: 0
          detail: "经济决策者识别度「{value}」：+{score}分"

      # 二级维度：信息互通与信任深度（32% → 组内 3 因子均权，每个满分 3.2）
      - field: kcr_04
        label: KCR-04 内幕信息共享度
        weight: 3.2
        source: custom_fields
        source_role: AR
        description: 原子指标：90 天内客户主动分享非公开信息次数（二级维度：信息互通与信任深度）
        input:
          type: select
          options: ["≥3次", "2次", "1次", "0次"]
        rule:
          type: mapping
          map:
            "≥3次": 3.2
            "2次": 2.24
            "1次": 1.28
            "0次": 0.32
          detail: "90天内主动分享 {value} 次（≥3次）：+{score}分"
          default_score: 0.32

      - field: kcr_05
        label: KCR-05 决策链信息透明
        weight: 3.2
        source: custom_fields
        source_role: AR
        description: 原子指标：能否绘制完整决策链权力地图（含时间线）（二级维度：信息互通与信任深度）
        input:
          type: select
          options: [完整含时间线, 部分, 否]
        rule:
          type: mapping
          map:
            完整含时间线: 3.2
            部分: 1.92
            否: 0.32
          default_score: 0.32
          detail: "决策链信息透明「{value}」：+{score}分"

      - field: kcr_06
        label: KCR-06 非正式互动深度
        weight: 3.2
        source: custom_fields
        source_role: AR
        description: 原子指标：非工作场合互动次数 + 私人联系方式（二级维度：信息互通与信任深度）
        input:
          type: select
          options: [≥3次且有私人联系方式, 1-2次且有私人联系方式, 仅工作场合, 无私人联系]
        rule:
          type: mapping
          map:
            "≥3次且有私人联系方式": 3.2
            1-2次且有私人联系方式: 2.24
            仅工作场合: 1.28
            无私人联系: 0.32
          default_score: 0.32
          detail: "非正式互动深度「{value}」：+{score}分"

      # 二级维度：决策支持与影响力（40% → 组内 5 因子均权，每个满分 2.4）
      - field: kcr_07
        label: KCR-07 关键人支持度分布
        weight: 2.4
        source: custom_fields
        source_role: AR
        description: 原子指标：支持者人数占比（决策流程方法论分类）（二级维度：决策支持与影响力）
        input:
          type: select
          options: ["≥60%支持且无反对", "40-59%支持", "20-39%支持", "<20%支持"]
        rule:
          type: mapping
          map:
            "≥60%支持且无反对": 2.4
            40-59%支持: 1.92
            20-39%支持: 1.44
            "<20%支持": 0.72
          default_score: 0.72
          detail: "关键人支持度「{value}」：+{score}分"

      - field: kcr_08
        label: KCR-08 内部Champion存在度
        weight: 2.4
        source: custom_fields
        source_role: AR
        description: 原子指标：是否有决策层人员主动推动我方方案（含影响 EB 能力）（二级维度：决策支持与影响力）
        input:
          type: select
          options: [CXO级且能影响EB, VP级, 总监级, 无]
        rule:
          type: mapping
          map:
            CXO级且能影响EB: 2.4
            VP级: 1.92
            总监级: 1.44
            无: 0.24
          default_score: 0.24
          detail: "内部Champion「{value}」：+{score}分"

      - field: kcr_09
        label: KCR-09 关键会议支持记录
        weight: 2.4
        source: custom_fields
        source_role: AR
        description: 原子指标：6 个月内关键人为我方公开表态次数（二级维度：决策支持与影响力）
        input:
          type: select
          options: ["≥3次公开表态", 1-2次公开表态, 无表态, 有反对]
        rule:
          type: mapping
          map:
            "≥3次公开表态": 2.4
            1-2次公开表态: 1.68
            无表态: 0.96
            有反对: 0.24
          default_score: 0.24
          detail: "关键会议支持「{value}」：+{score}分"

      - field: kcr_10
        label: KCR-10 竞品阻击能力
        weight: 2.4
        source: custom_fields
        source_role: AR
        description: 原子指标：面对竞品时关键人主动帮助程度（二级维度：决策支持与影响力）
        input:
          type: select
          options: [主动阻击, 提供信息, 中立, 偏向竞品]
        rule:
          type: mapping
          map:
            主动阻击: 2.4
            提供信息: 1.68
            中立: 0.96
            偏向竞品: 0.24
          default_score: 0.24
          detail: "竞品阻击能力「{value}」：+{score}分"

      - field: kcr_10b
        label: KCR-10B 决策流程影响力
        weight: 2.4
        source: custom_fields
        source_role: AR
        description: 原子指标：掌握决策流程 + 关键节点可控数（决策流程方法论影响力）（二级维度：决策支持与影响力）
        input:
          type: select
          options: ["全流程且≥3节点可控", "1-2节点可控", 部分掌握, 不了解]
        rule:
          type: mapping
          map:
            "全流程且≥3节点可控": 2.4
            1-2节点可控: 1.68
            部分掌握: 0.96
            不了解: 0.24
          default_score: 0.24
          detail: "决策流程影响力「{value}」：+{score}分"

  # ② ER 普遍客户关系（权重 18%，MCR + 产品使用数据）───────────────────────
  - key: er
    name: ER 普遍客户关系
    max_score: 18
    enabled: true
    description: 基层对接覆盖与配合度 · 技术层关系 · 基层赋能与维护（AR+SR+FR 协同，月度填报）
    factors:

      # 二级维度：基层对接覆盖与配合度（35% → 组内 3 因子均权，每个满分 2.1）
      - field: er_01
        label: ER-01 基层触点覆盖度
        weight: 2.1
        source: custom_fields
        source_role: AR
        description: 原子指标：有稳定对接基层岗位数占比（二级维度：基层对接覆盖与配合度）
        input:
          type: select
          options: ["100%", "≥80%", "≥60%", "≥40%", "<40%"]
        rule:
          type: mapping
          map:
            "100%": 2.1
            "≥80%": 1.68
            "≥60%": 1.26
            "≥40%": 0.84
            "<40%": 0.21
          detail: "基层触点覆盖 {value}%（100%）：+{score}分"
          default_score: 0.21

      - field: er_02
        label: ER-02 日常配合响应度
        weight: 2.1
        source: custom_fields
        source_role: AR
        description: 原子指标：需求调研/资料提供/方案评审是否 1 周内响应（二级维度：基层对接覆盖与配合度）
        input:
          type: select
          options: [3项均1周内响应, 2项响应, 1项响应, 0项响应]
        rule:
          type: mapping
          map:
            3项均1周内响应: 2.1
            2项响应: 1.47
            1项响应: 0.84
            0项响应: 0.21
          default_score: 0.21
          detail: "日常配合响应「{value}」：+{score}分"

      - field: er_03
        label: ER-03 基层执行口碑
        weight: 2.1
        source: custom_fields
        source_role: FR
        description: 原子指标：投诉数量 + 基层是否主动提供现场信息（二级维度：基层对接覆盖与配合度）
        input:
          type: select
          options: [无投诉且主动提供信息, 无投诉, 1-2次投诉, "≥3次投诉"]
        rule:
          type: mapping
          map:
            无投诉且主动提供信息: 2.1
            无投诉: 1.47
            1-2次投诉: 0.84
            "≥3次投诉": 0.21
          default_score: 0.21
          detail: "基层执行口碑「{value}」：+{score}分"

      # 二级维度：技术层关系（35% → 组内 3 因子均权，每个满分 2.1）
      - field: er_04
        label: ER-04 技术交流频度
        weight: 2.1
        source: custom_fields
        source_role: SR
        description: 原子指标：3 个月内与客户技术团队有效交流次数（二级维度：技术层关系）
        input:
          type: select
          options: ["≥6次", "4-5次", "2-3次", "1次", "0次"]
        rule:
          type: mapping
          map:
            "≥6次": 2.1
            "4-5次": 1.68
            "2-3次": 1.26
            "1次": 0.84
            "0次": 0.21
          detail: "3个月技术交流 {value} 次（≥6次）：+{score}分"
          default_score: 0.21

      - field: er_05
        label: ER-05 技术认可度
        weight: 2.1
        source: custom_fields
        source_role: SR
        description: 原子指标：方案在客户内部评价 + 是否参与标书参数制定（二级维度：技术层关系）
        input:
          type: select
          options: [标杆且参与定标, 标杆, 相当, 落后]
        rule:
          type: mapping
          map:
            标杆且参与定标: 2.1
            标杆: 1.68
            相当: 1.05
            落后: 0.42
          default_score: 0.42
          detail: "技术认可度「{value}」：+{score}分"

      - field: er_06
        label: ER-06 技术层信息获取
        weight: 2.1
        source: custom_fields
        source_role: SR
        description: 原子指标：技术负责人是否主动同步内部技术路线信息（二级维度：技术层关系）
        input:
          type: select
          options: [主动同步, 问才告知, 不透露]
        rule:
          type: mapping
          map:
            主动同步: 2.1
            问才告知: 1.26
            不透露: 0.42
          default_score: 0.42
          detail: "技术层信息获取「{value}」：+{score}分"

      # 二级维度：基层赋能与维护（30% → 组内 4 因子均权，每个满分 1.35）
      - field: er_07
        label: ER-07 培训赋能频次
        weight: 1.35
        source: custom_fields
        source_role: SR
        description: 原子指标：半年内对客户基层团队的培训/赋能次数（二级维度：基层赋能与维护）
        input:
          type: select
          options: ["≥4次", "2-3次", "1次", "0次"]
        rule:
          type: mapping
          map:
            "≥4次": 1.35
            "2-3次": 0.945
            "1次": 0.54
            "0次": 0.135
          detail: "半年培训赋能 {value} 次（≥4次）：+{score}分"
          default_score: 0.135

      - field: er_08
        label: ER-08 问题响应满意度
        weight: 1.35
        source: custom_fields
        source_role: FR
        description: 原子指标：基层提出问题/需求的响应及时性与解决质量（%）（二级维度：基层赋能与维护）
        input:
          type: select
          options: ["100%", "≥80%", "≥60%", "<60%"]
        rule:
          type: mapping
          map:
            "100%": 1.35
            "≥80%": 0.945
            "≥60%": 0.54
            "<60%": 0.135
          detail: "问题响应满意 {value}%（100%）：+{score}分"
          default_score: 0.135

      - field: er_09
        label: ER-09 基层关系备份
        weight: 1.35
        source: custom_fields
        source_role: AR
        description: 原子指标：是否有 2 人以上可独立对接该客户基层（人）（二级维度：基层赋能与维护）
        input:
          type: select
          options: ["≥2人", "1人", "0人"]
        rule:
          type: mapping
          map:
            "≥2人": 1.35
            "1人": 0.675
            "0人": 0.135
          detail: "可独立对接基层 {value} 人（≥2人）：+{score}分"
          default_score: 0.135

      - field: er_09b
        label: ER-09B 用户产品使用反馈
        weight: 1.35
        source: custom_fields
        source_role: FR
        description: 原子指标：终端用户反馈收集机制 + 反馈采纳闭环率（Customer Health Score 产品使用数据，二级维度：基层赋能与维护）
        input:
          type: select
          options: ["标准化机制且≥90%", "60-89%", "<60%", 无]
        rule:
          type: mapping
          map:
            "标准化机制且≥90%": 1.35
            60-89%: 0.945
            "<60%": 0.54
            无: 0.135
          default_score: 0.135
          detail: "用户产品使用反馈「{value}」：+{score}分"

  # ③ OR 组织客户关系（权重 14%，MCR + 战略客户管理 SAM）────────────────────
  - key: or
    name: OR 组织客户关系
    max_score: 14
    enabled: true
    description: 战略合作深度 · 组织协同与绑定（AR+管理层，季度填报）
    factors:

      # 二级维度：战略合作深度 / 组织协同与绑定（各 50% → 组内 3 因子均权，每个满分 2.333333）
      - field: or_01
        label: OR-01 战略协议层级
        weight: 2.333333
        source: custom_fields
        source_role: 管理层
        description: 原子指标：是否有战略协议 + 协议层级（集团/区域/项目级）（二级维度：战略合作深度）
        input:
          type: select
          options: [集团级, 区域级, 项目级框架, 无]
        rule:
          type: mapping
          map:
            集团级: 2.333333
            区域级: 1.633333
            项目级框架: 0.933333
            无: 0
          default_score: 0
          detail: "战略协议层级「{value}」：+{score}分"

      - field: or_02
        label: OR-02 高层互访频次
        weight: 2.333333
        source: custom_fields
        source_role: 管理层
        description: 原子指标：12 个月内 VP 及以上正式互访/会晤次数（二级维度：战略合作深度）
        input:
          type: select
          options: ["≥4次", "2-3次", "1次", "0次"]
        rule:
          type: mapping
          map:
            "≥4次": 2.333333
            "2-3次": 1.633333
